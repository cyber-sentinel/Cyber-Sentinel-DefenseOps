name: Repository Hygiene

on:
  pull_request:
  push:
    branches: [ main, "hardening/**" ]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for sensitive filenames
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name "*.pem" -o -name "*.key" -o -name "*.pfx" -o -name ".env" \) | grep -q .; then
            echo "Potential secret-bearing file detected."
            exit 1
          fi

      - name: Install Python validation dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyyaml sigma-cli
          python -m pip install --disable-pip-version-check git+https://github.com/SigmaHQ/pySigma-validators-sigmaHQ.git

      - name: Install native validation engines
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y yara suricata
          yara --version
          suricata --build-info | head -n 20

      - name: Validate repository detection model
        shell: bash
        run: python tools/validate_detection_pack.py

      - name: Validate Sigma with Sigma CLI
        shell: bash
        run: |
          sigma check --fail-on-error --fail-on-issues detections/windows/powershell-lolbins/sigma

      - name: Compile YARA with yarac
        shell: bash
        run: |
          yarac detections/windows/powershell-lolbins/yara/powershell_lolbin_artifacts.yar /tmp/cyber-sentinel-powershell-lolbins.yarc

      - name: Validate Suricata rules with native engine
        shell: bash
        run: |
          sudo mkdir -p /tmp/suricata-log
          sudo suricata -T -c /etc/suricata/suricata.yaml -S detections/windows/powershell-lolbins/suricata/powershell_lolbin_http.rules -l /tmp/suricata-log

      - name: Validate positive and negative detection fixtures
        shell: bash
        run: python tools/test_detection_fixtures.py

      - name: Validate threat hunting packs
        shell: bash
        run: python tools/validate_hunt_pack.py

      - name: Validate text files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = []
          checked = {'.md','.yaml','.yml','.json','.py','.ps1','.sh','.spl','.kql','.eql','.esql','.cql','.powerquery','.yaral','.yar','.rules','.zeek','.xml'}
          for p in Path('.').rglob('*'):
              if p.is_file() and '.git' not in p.parts and p.suffix.lower() in checked:
                  try:
                      t = p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      bad.append(f"{p}: not UTF-8")
                      continue
                  for i, line in enumerate(t.splitlines(), 1):
                      if line.rstrip() != line:
                          bad.append(f"{p}:{i}: trailing whitespace")
          if bad:
              print('\n'.join(bad))
              raise SystemExit(1)
          print("Repository hygiene checks passed.")
          PY
